# ============================================================================
# 本仓库 CI workflow（native 目标）
#
# 本文件是本仓库唯一的 CI 定义，由 push / pull_request / workflow_dispatch 触发。
# 模块是独立 git 仓库，workflow 必须放在模块内 .github/workflows/ 才会被 GitHub Actions 触发。
# 本仓库是独立发布单元，不存在仓库外的 CI 定义或汇总模板。
#
# 六道门禁（顺序执行，任一步非 0 即整 job 失败）：
#   1. moon check --deny-warn
#   2. moon build
#   3. moon test
#   4. moon fmt --check
#   5. moon info && git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti
#      （pkg.generated.mbti 快照与源码一致性 fail-closed；cmd/main 下的快照同样纳入 diff 范围。
#        纳入范围 = 本仓库内受版本控制且由 moon info 生成的全部快照，即仓库根与 cmd/main 两处；
#        pkg.generated.mbti.r1 是 R1 基线存档、不由 moon info 生成，.mooncakes/ 下第三方包的
#        快照不受本仓库版本控制，二者均不在 diff 范围。）
#   6. python3 tools/cli-golden.py
#      （L4 CLI 记录行/退出码/落盘字节黄金契约，W2 T-W2-4；自建 native CLI + 文本 hex 夹具，
#        二进制零入库。缺工具链/构建失败即失败，不静默跳过。）
# （可选 moon clean：仅清理，continue-on-error，不参与判定）
#
# 工具链版本说明：
#   （2026-11-19 起不再钉死：安装脚本只提供 latest，版本化产物一律 HTTP 403，
#     详见下方依赖策略末条）
#
# 本仓库依赖策略：
#   - 禁止无版本 `moon update`：`moon update --help` 实测只有 --target-dir/-q/-v/--trace/--dry-run，
#     没有任何锁定版本的参数，因此 CI 中一律不出现 `moon update`。
#   - 依赖只按各模块 moon.mod 中已钉死的版本声明（例：bobzhang/zip@0.1.2）由 check/build 自动同步。
#   - 如确需显式预取：`moon fetch <author>/<name>@<version> --no-update`（钉死版本且不刷新 registry 元数据）。
#   - 不用 `moon build --frozen`：全新 checkout 没有本地依赖缓存，--frozen 会直接失败。
#   - 工具链安装（2026-11-19 修正）：cli.moonbitlang.com 只提供 latest/nightly，版本化产物
#     `binaries/<版本>/...` 与 `cores/core-<版本>.tar.gz` 一律 HTTP 403（2026-11-19 实测
#     0.1.20261104 与 0.1.20261117 均 403，仅 latest 返回 200），`unix.sh <版本>` 参数不可能成功；
#     旧策略「钉死版本 + 回退 latest + 精确版本断言」逻辑自相矛盾，latest 前进后断言必然失败。
#     现改为：显式安装 latest（失败即 fail，不做静默回退）；打印实际版本供日志追溯；只断言
#     可验证的不变量（moon 来自本次安装目录、三件套均在、core 已安装）。版本漂移不再硬失败。
# ============================================================================
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-gates:
    name: five-gates (tflite_ffi)
    runs-on: ubuntu-latest
    # 本模块 preferred_target = "native"：build/test 走 native 后端，链接项目内 C stub
    # （stub 例外；真实库对接按本仓库门禁分阶段解禁）。
    # CI runner 是 ubuntu-latest（用系统 cc 链接），该路径 [仍需实测]；Windows/MSVC x86_64
    # 本机同序实跑已通过（[已复验-本地等价]），不等同于 GitHub Actions 云上实跑。
    steps:
      - name: Checkout tflite_ffi
        uses: actions/checkout@v5

      - name: Install MoonBit toolchain (latest)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.moon/tmp"
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh -o "$HOME/.moon/tmp/install.sh"
          bash "$HOME/.moon/tmp/install.sh"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain installation (moon / moonc / moonrun / core)
        shell: bash
        run: |
          set -euo pipefail
          out="$(moon version --all)"
          echo "$out"
          moon_path="$(command -v moon)"
          if [[ "$moon_path" != "$HOME/.moon/bin/moon" ]]; then
            echo "::error::moon resolves to $moon_path, expected $HOME/.moon/bin/moon (a stale toolchain is earlier on PATH)"
            exit 1
          fi
          for tool in moon moonc moonrun; do
            grep -qE "^$tool " <<<"$out" || {
              echo "::error::$tool missing from 'moon version --all'"
              exit 1
            }
          done
          core_mod="$HOME/.moon/lib/core/moon.mod"
          if [[ ! -f "$core_mod" ]]; then
            echo "::error::missing $core_mod (core not installed)"
            exit 1
          fi
          echo "--- $core_mod ---"
          grep -E '^(name|version) *=' "$core_mod" || true

      # ---- 五道门禁：顺序执行，任一非 0 即失败 ----
      - name: "Gate 1/6 · moon check --deny-warn"
        shell: bash
        run: moon check --deny-warn

      - name: "Gate 2/6 · moon build"
        shell: bash
        run: moon build

      - name: "Gate 3/6 · moon test"
        shell: bash
        run: moon test

      - name: "Gate 4/6 · moon fmt --check"
        shell: bash
        run: moon fmt --check

      - name: "Gate 5/6 · moon info && git diff --exit-code -- pkg.generated.mbti"
        shell: bash
        run: |
          set -euo pipefail
          moon info
          if ! git diff --exit-code -- pkg.generated.mbti cmd/main/pkg.generated.mbti; then
            echo "::error::Gate 5/6 failed: pkg.generated.mbti snapshot out of sync with sources. Run 'moon info' locally and commit the regenerated snapshot together with the API change (additive changes also require a regenerated snapshot and an API-change note in this repository's README.md §3 and docs/CHANGELOG.md)."
            exit 1
          fi
          echo "Gate 5/6 OK: snapshot in sync (pkg.generated.mbti + cmd/main/pkg.generated.mbti)"

      - name: "Gate 6/6 · CLI record-line golden (L4)"
        shell: bash
        run: python3 tools/cli-golden.py

      - name: "Optional · moon clean (not a gate)"
        shell: bash
        continue-on-error: true
        run: moon clean
